<div class="login-page">

  <div class="login-wrapper">

    <!-- =========================================
         LADO ESQUERDO - LOGIN
    ========================================== -->
    <section class="login-section">

      <div class="login-content">

        <!-- Logo -->
        <div class="login-logo">
          <img
            src="casa.png"
            alt="Logo"
          >
        </div>

        <!-- Título -->
        <div class="login-header">

          <h1>
            Bem-vindo! 👋
          </h1>

        </div>


        <!-- Formulário -->
        <form
          [formGroup]="loginForm"
          (ngSubmit)="onSubmit()"
          class="login-form"
        >

          <!-- Email -->
          <div class="form-group">

            <label for="email">
              Email
            </label>

            <input
              id="email"
              type="email"
              formControlName="email"
              placeholder="Exemplo@email.com"
              autocomplete="email"
            >

          </div>


          <!-- Senha -->
          <div class="form-group">

            <label for="password">
              Senha
            </label>

            <input
              id="password"
              type="password"
              formControlName="password"
              placeholder="Digite sua senha"
              autocomplete="current-password"
            >

          </div>


          <!-- Esqueci senha -->
          <div class="forgot-password">

            <a href="#">
              Esqueceu sua senha?
            </a>

          </div>


          <!-- Entrar -->
          <button
            type="submit"
            class="login-button"
            [disabled]="loginForm.invalid"
          >
            Entrar
          </button>


          <!-- Separador -->
          <div class="divider">

            <span></span>

            <small>Ou</small>

            <span></span>

          </div>


          <!-- Google -->
          <button (click)="loginComGoogle()"
            type="button"
            class="social-button"
          >
            <span class="social-icon google">
              G
            </span>

            <span>
              Entrar com Google
            </span>
          </button>


          <!-- Facebook -->
          <button
            type="button"
            class="social-button"
          >
            <span class="social-icon facebook">
              f
            </span>

            <span>
              Entrar com Facebook
            </span>
          </button>


          <!-- Cadastro -->
          <p class="signup-text">

            Não possui uma conta?

            <a href="#">
              Cadastre-se
            </a>

          </p>

        </form>

      </div>


      <!-- Copyright -->
      <div class="copyright">
        © 2025 TODOS OS DIREITOS RESERVADOS
      </div>

    </section>


    <!-- =========================================
         LADO DIREITO - IMAGEM
    ========================================== -->
    <section class="image-section">

      <div class="image-overlay"></div>

      <img
        src="https://img.magnific.com/fotos-gratis/3d-render-login-seguro-e-ilustracao-de-senha_107791-16640.jpg?semt=ais_hybrid&w=740&q=80"
        alt=""
        class="login-image"
      >

    </section>

  </div>

</div>

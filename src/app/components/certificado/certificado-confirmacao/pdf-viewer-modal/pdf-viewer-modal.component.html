<div class="modal fade" #modalElement tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-xl" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title h5">Visualizar Certificado</h2>
        <button type="button" class="btn-close" (click)="onCancel()" aria-label="Fechar"></button>
      </div>
      <div class="modal-body">
        <iframe [src]="safePdfUrl" width="100%" height="500px" style="border: none;"></iframe>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="onCancel()">Fechar</button>
        <button type="button" class="btn btn-primary" (click)="onDownload()">Download</button>
      </div>
    </div>
  </div>
</div>

<div class="container">
    <div class="card" style="margin-top: 5rem;">
        <div class="card-header">
            <h3 class="text-center">Cadastrar Lecionario</h3>
        </div>
        <div class="card-body">

            <form [formGroup]="form" class="p-4 max-w-xl mx-auto space-y-6">
                <h4>
                    Período
                </h4>
                <br>

                <div class="row g-3">
                    <div class="col-md-4 col-12">
                        <label class="form-label" for="anoLiturgico">Ano Litúrgico</label>
                        <select id="anoLiturgico" class="form-select" formControlName="ano_liturgico">
                            <option value="A">Ano A</option>
                            <option value="B">Ano B</option>
                            <option value="C">Ano C</option>
                        </select>
                    </div>
                </div>

                <div class="row g-3 mt-1">
                    <div class="col-md-4 col-12">
                        <label class="form-label" for="tempo">Tempo Litúrgico</label>
                        <input id="tempo" class="form-control" formControlName="tempo" placeholder="Ex: Páscoa" />
                    </div>
                    <div class="col-md-4 col-12">
                        <label class="form-label" for="dia">Dia</label>
                        <input id="dia" type="date" class="form-control" formControlName="dia" />
                    </div>
                    <div class="col-md-4 col-12">
                        <label class="form-label" for="nome">Nome do Dia</label>
                        <input id="nome" class="form-control" formControlName="nome" />
                    </div>
                </div>


                <div class="oracoes" formArrayName="oracoes">
                    <h4>Orações</h4>
                    <br>
                    <div class="campo-oracao" *ngFor="let oracao of oracoes.controls; let i = index">
                        <div class="campo-oracao-input flex-grow-1">
                            <label class="form-label">Oração {{ i + 1 }}</label>
                            <textarea class="form-control" [formControlName]="i" rows="3"></textarea>
                        </div>
                        <button type="button" class="btn btn-outline-danger" (click)="removeOracao(i)"
                            *ngIf="oracoes.length > 1" aria-label="Remover oração">
                            <mat-icon style="font-size: 14pt;">delete</mat-icon>
                        </button>
                    </div>

                    <button type="button" class="btn add" (click)="addOracao()">
                        <mat-icon>add</mat-icon> Adicionar Oração
                    </button>
                </div>


                <!-- Leituras -->
                <div formArrayName="leituras" class="leituras">
                    <h4>
                        Leituras
                    </h4>
                    <br>
                    <div class="campo-leituras" *ngFor="let leitura of leituras.controls; let i = index"
                        [formGroupName]="i">
                        <div class="row g-3 align-items-start">
                            <div class="col-md-4 col-12">
                                <label class="form-label">Tipo</label>
                                <select class="form-select" formControlName="tipo">
                                    <option value="primeira">Primeira</option>
                                    <option value="interlecional">Interlecional</option>
                                    <option value="segunda">Segunda</option>
                                    <option value="evangelho">Evangelho</option>
                                    <option value="salmo">Salmo</option>
                                </select>
                            </div>
                            <div class="col-md-7 col-12">
                                <label class="form-label">Texto</label>
                                <input class="form-control" formControlName="texto" placeholder="Ex: Salmo 23" />
                            </div>
                            <div class="col-md-1 col-12 d-flex justify-content-start pt-md-4">
                                <button type="button" class="btn btn-outline-danger"
                                    (click)="removeLeitura(i)" *ngIf="leituras.length > 1" aria-label="Remover leitura">
                                    <mat-icon style="font-size: 14pt;">delete</mat-icon>
                                </button>
                            </div>
                        </div>
                    </div>
                    <button type="button" class="btn add" (click)="addLeitura()">
                        <mat-icon>add</mat-icon> Adicionar Leitura
                    </button>

                </div>
                <div class="text-right mt-5 d-flex justify-content-end">
                    <button type="submit" class="btn add" (click)="submit()">
                        <mat-icon>save</mat-icon>
                        Salvar
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>

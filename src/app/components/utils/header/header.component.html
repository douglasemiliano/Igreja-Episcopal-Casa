<header class="header" [class.collapsed]="collapsed">
  <div class="header-content">

    <!-- MENU / SIDEBAR -->
    <button class="menu-button" type="button" aria-label="Alternar menu" (click)="onToggleSidebar()">
      <mat-icon>menu</mat-icon>
    </button>


    <!-- LINKS -->
    <nav class="header-nav">

      <!-- <a href="#" class="nav-link">
        Apps
      </a>

      <a href="#" class="nav-link">
        Chat
      </a>

      <a href="#" class="nav-link">
        Calendar
      </a>

      <a href="#" class="nav-link">
        Email
      </a> -->

    </nav>


    <!-- BUSCA -->
    <button
      class="icon-button search-toggle"
      type="button"
      aria-label="Buscar no menu"
      [attr.aria-expanded]="buscaAberta"
      (click)="alternarBusca()">

      <mat-icon>search</mat-icon>

    </button>

    <app-searchbar
      class="header-search"
      [class.header-search--aberta]="buscaAberta"
      [fechavel]="isMobile"
      placeholder="Buscar no menu..."
      (fechado)="fecharBusca()"
      (navegou)="fecharBusca()">
    </app-searchbar>


    <button class="icon-button" (click)="onDarkToggle()">

      <mat-icon class="material-icons-outlined">
        {{ isDarkMode ? 'light_mode' : 'dark_mode' }}
      </mat-icon>

    </button>


    <!-- USUÁRIO -->
    <div class="header-user">
      <button
        class="user-trigger"
        type="button"
        aria-label="Abrir menu do usuário"
        aria-haspopup="menu"
        [attr.aria-expanded]="isUserMenuOpen"
        aria-controls="user-menu"
        (click)="toggleUserMenu($event)"
      >
        @if (semFoto) {
          <mat-icon class="avatar-fallback" aria-hidden="true">person</mat-icon>
        } @else {
          <img [src]="fotoUsuario" [alt]="nomeUsuario" (error)="registrarErroFoto(fotoUsuario)">
        }

        <span class="user-info">
          <strong>
            {{ nomeUsuario }}
          </strong>

          <small>
            {{ roleLabel }}
          </small>
        </span>

        <mat-icon class="user-menu-icon">expand_more</mat-icon>
      </button>

      @if (isUserMenuOpen) {
        <div class="user-menu" id="user-menu" role="menu" (click)="$event.stopPropagation()">
          <div class="user-menu-profile">
            @if (semFoto) {
              <mat-icon class="avatar-fallback" aria-hidden="true">person</mat-icon>
            } @else {
              <img [src]="fotoUsuario" [alt]="nomeUsuario" (error)="registrarErroFoto(fotoUsuario)">
            }
            <div class="user-menu-details">
              <strong>{{ nomeUsuario }}</strong>
              <span>{{ emailUsuario }}</span>
              <small>{{ roleLabel }}</small>
            </div>
          </div>

          <div class="user-menu-divider"></div>

          <button class="user-menu-item" type="button" role="menuitem" (click)="goToPerfil()">
            <mat-icon>person</mat-icon>
            <span>Meu perfil</span>
          </button>

          <button
            class="user-menu-item user-menu-item--logout"
            type="button"
            role="menuitem"
            (click)="logout()"
          >
            <mat-icon>logout</mat-icon>
            <span>Sair</span>
          </button>
        </div>
      }
    </div>

  </div>
</header>
